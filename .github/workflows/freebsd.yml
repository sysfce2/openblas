name: freebsd

on: pull_request

jobs:
  bsd-x86:
    runs-on: ubuntu-latest
    steps:
     -uses: actions/checkout@v6
     -name: Default build
      id: bsd-x86-64
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |

        run: |
          freebsd-version
          sysctl hw.ncpu
          make
